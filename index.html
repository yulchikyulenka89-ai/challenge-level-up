<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#07091b" />
  <title>ELU Live — English Level Up</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 11-13h-8z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m15 9 6-6m-5 0h5v5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m1-15a4 4 0 0 1 0 7m2 2a6 6 0 0 1 3 5v1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="m3 8 4-5h10l4 5-9 13zM3 8h18M8 3l4 5 4-5M12 8v13"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 3h8v5a4 4 0 0 1-8 0zM8 5H3v2a5 5 0 0 0 5 5m8-7h5v2a5 5 0 0 1-5 5m-4 0v5m-4 4h8m-6-4h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4l-.5 3a8 8 0 0 0-1.8 1L5.7 6.1l-2 3.4 2.2 1.5a7 7 0 0 0 0 2l-2.1 1.5 2 3.4 2.3-1a8 8 0 0 0 1.8 1l.5 3h4l.4-3a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2.1-1.5a7 7 0 0 0 .1-1z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M5 9H2v6h3l5 4V5zm9 0a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 14v6h16v-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zm9-13 4 4"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m9 7-5 5 5 5M5 12h9a6 6 0 0 1 6 6"/></symbol>
  </svg>

  <div class="noise" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div><div class="cursor-ring" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <button class="brand" data-route="home" aria-label="ELU Live — на главную"><span>ELU</span><small><b></b> LIVE</small></button>
      <nav id="mainNav"></nav>
      <div class="sidebar-bottom">
        <div class="level-card"><strong>B1</strong><span>твой уровень</span><small>Intermediate</small></div>
        <button class="mini-profile" data-route="profile" id="miniProfile"></button>
        <div class="side-actions">
          <button data-action="toggle-sound" class="icon-btn" aria-label="Переключить звуки"><svg><use href="#i-volume"/></svg></button>
          <button data-action="open-admin" class="icon-btn" aria-label="Открыть админ-панель"><svg><use href="#i-settings"/></svg></button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-brand" data-route="home">ELU <i></i> LIVE</button>
        <div class="live-pill"><span></span> SEASON LIVE</div>
        <div class="top-actions">
          <span class="pill vip">VIP PASS</span><span class="pill">🔥 <b id="headerStreak">0</b></span><span class="pill cyan">◆ <b id="headerXp">0</b></span>
          <button class="avatar-button" data-route="profile" id="headerAvatar" aria-label="Открыть профиль"></button>
        </div>
      </header>
      <div id="previewBanner" class="preview-banner hidden"></div>
      <section id="view" tabindex="-1"></section>
    </main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Мобильная навигация"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="xpBurst" class="xp-burst" aria-hidden="true"></div>
  <script src="/app.js"></script>
</body>
</html>
