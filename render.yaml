services:
  - type: web
    name: elu-live
    runtime: node
    plan: free
    region: frankfurt
    branch: backend-auth-wip
    buildCommand: npm ci && npm run build
    startCommand: npm start
    initialDeployHook: npm run provision
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elu-live-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: "24"
      - key: ELU_ALENA_PASSWORD
        sync: false
      - key: ELU_NASTYA_PASSWORD
        sync: false
      - key: ELU_EGOR_PASSWORD
        sync: false
      - key: ELU_KIRILL_PASSWORD
        sync: false
      - key: ELU_ADMIN_PASSWORD
        sync: false

databases:
  - name: elu-live-db
    plan: free
    region: frankfurt
    databaseName: elu_live
    user: elu_live
    postgresMajorVersion: "18"
